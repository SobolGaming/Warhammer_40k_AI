name: ci

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.18.0"
  PYTHON_VERSION: "3.14.5"
  UV_VERSION: "0.11.29"

jobs:
  quality-fast:
    name: quality-fast
    if: always()
    needs: [lint, contract-conformance, code-quality, semantic-audit-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful quality lanes
        if: >-
          ${{
            needs.lint.result != 'success' ||
            needs.contract-conformance.result != 'success' ||
            needs.code-quality.result != 'success' ||
            needs.semantic-audit-macos.result != 'success'
          }}
        run: |
          echo "One or more quality lanes did not succeed."
          exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync lint dependencies
        run: uv sync --locked --no-default-groups --group lint

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Import boundary contracts
        run: uv run --no-sync lint-imports

      - name: Verify behavioral shard manifests
        run: uv run --no-sync python scripts/build_test_shards.py --check --shard-count 12

  contract-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: conformance/typescript/package-lock.json

      - name: Sync contract dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Install TypeScript conformance dependencies
        working-directory: conformance/typescript
        run: npm ci

      - name: Verify external contract bundle against pull request base
        if: github.event_name == 'pull_request'
        run: >-
          uv run --no-sync python scripts/build_external_contract.py --check
          --base-ref ${{ github.event.pull_request.base.sha }}

      - name: Verify external contract bundle
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/build_external_contract.py --check

      - name: Smoke installed external contract wheel
        run: uv run --no-sync python scripts/smoke_installed_contract_wheel.py

      - name: Verify generated TypeScript contract client
        working-directory: conformance/typescript
        run: npm run check

      - name: Execute TypeScript unit tests
        working-directory: conformance/typescript
        run: npm run test:unit

      - name: Run Phase 18M-A conformance scenario
        working-directory: conformance/typescript
        run: npm run conformance

  code-quality:
    name: code-quality
    if: always()
    needs: [quality-policy, quality-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download this complete quality attempt
        if: always()
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: quality-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-*
          path: reports/quality-timing/downloads

      - name: Reconcile all four exact-head producers
        timeout-minutes: 10
        id: reconcile
        if: always()
        env:
          QUALITY_RESULTS: '{"quality-policy":"${{ needs.quality-policy.result }}","quality-shards":"${{ needs.quality-shards.result }}"}'
        run: >-
          python -B -m scripts.quality_evidence reports/quality-timing/downloads
          --results "$QUALITY_RESULTS"

      - name: Require successful producers and reconciliation
        if: >-
          ${{
            always() &&
            (
              needs.quality-policy.result != 'success' ||
              needs.quality-shards.result != 'success' ||
              steps.reconcile.outcome != 'success'
            )
          }}
        run: |
          echo "Complete quality evidence or a required producer did not succeed."
          exit 1

  quality-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Declare quality evidence before dependency setup
        run: python -B -m scripts.quality_runner prepare --shard 2

      - name: Fetch original historical validation inputs
        run: git fetch --no-tags --no-recurse-submodules origin 4a8fb3c10cbf9c6ce1766f048508b8a16f8f24e8

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Current performance assessment and serial smoke
        timeout-minutes: 3
        env:
          PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PERFORMANCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--base-ref "$PERFORMANCE_BASE" --output reports/performance-smoke.json)
          if [ -n "$PERFORMANCE_PR_HEAD" ]; then
            args+=(--pr-head "$PERFORMANCE_PR_HEAD")
          fi
          uv run --no-sync python -B -m scripts.check_performance_policy "${args[@]}"

      - name: Code-quality shard 2
        timeout-minutes: 10
        run: >-
          uv run --no-sync python -B -m scripts.quality_runner run --shard 2
          --scratch "$RUNNER_TEMP/quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-2"

      - name: Preserve original performance attempts after any failure
        if: always()
        run: |
          out="reports/quality-timing/quality-$GITHUB_REPOSITORY_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA-2/performance"
          if [ ! -d "$out" ]; then
            mkdir -p "$out"
            for source in reports/performance-smoke.json reports/performance-attempts; do
              if [ -e "$source" ]; then cp -a "$source" "$out/"; fi
            done
          fi

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-2
          path: reports/quality-timing/quality-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-2/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  quality-shards:
    name: quality-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "3", "4"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Declare quality evidence before dependency setup
        run: python -B -m scripts.quality_runner prepare --shard ${{ matrix.shard }}

      - name: Fetch original historical validation inputs
        run: git fetch --no-tags --no-recurse-submodules origin 4a8fb3c10cbf9c6ce1766f048508b8a16f8f24e8

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Code-quality shard
        timeout-minutes: 10
        env:
          QUALITY_SHARD: ${{ matrix.shard }}
        run: >-
          uv run --no-sync python -B -m scripts.quality_runner run --shard "$QUALITY_SHARD"
          --scratch "$RUNNER_TEMP/quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$QUALITY_SHARD"

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.shard }}
          path: reports/quality-timing/quality-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.shard }}/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  semantic-audit-macos:
    name: semantic-audit-macos
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Verify cross-source semantic audit
        run: >-
          uv run --no-sync pytest
          tests/code_quality/test_generated_ability_support_artifacts.py
          -q -n0 --no-cov

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync type-check dependencies
        run: uv sync --locked --no-default-groups --group typecheck

      - name: Mypy
        run: uv run --no-sync mypy src tests

  pyright:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync type-check dependencies
        run: uv sync --locked --no-default-groups --group typecheck

      - name: Pyright
        run: uv run --no-sync pyright

  behavior-tests:
    name: behavior-shard-${{ matrix.shard_id }}
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_id: "1"
            manifest: ci/test_shards/shard-1.txt
          - shard_id: "2"
            manifest: ci/test_shards/shard-2.txt
          - shard_id: "3"
            manifest: ci/test_shards/shard-3.txt
          - shard_id: "4"
            manifest: ci/test_shards/shard-4.txt
          - shard_id: "5"
            manifest: ci/test_shards/shard-5.txt
          - shard_id: "6"
            manifest: ci/test_shards/shard-6.txt
          - shard_id: "7"
            manifest: ci/test_shards/shard-7.txt
          - shard_id: "8"
            manifest: ci/test_shards/shard-8.txt
          - shard_id: "9"
            manifest: ci/test_shards/shard-9.txt
          - shard_id: "10"
            manifest: ci/test_shards/shard-10.txt
          - shard_id: "11"
            manifest: ci/test_shards/shard-11.txt
          - shard_id: "12"
            manifest: ci/test_shards/shard-12.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Fetch retained Core description baseline
        run: git fetch --depth=1 --no-tags --no-recurse-submodules origin b27c5d4e5f75dd7f89353a968a88d1b24b2681a4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Identify selected-source inputs
        id: source-inputs
        run: |
          uv run --no-sync python -B - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          from tools.ability_support_sources import ability_support_index_inputs
          from warhammer40k_core.rules.selected_source_index import source_input_hashes
          source = Path("data/source_snapshots/wahapedia/10th-edition/2026-06-14/json")
          identity = {"python": sys.version, "inputs": source_input_hashes(ability_support_index_inputs(source))}
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"key=selected-source-index-v1-{digest}\n")
          PY

      - name: Restore exact selected-source index
        # Keep one real shard cold on PRs and main; a warm retry is not cold qualification.
        if: ${{ matrix.shard_id != '1' }}
        id: source-index-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/selected-army-source-index
          key: ${{ steps.source-inputs.outputs.key }}

      - name: Run behavioral coverage shard
        id: behavior
        # Temporary owner-approved setup-and-test cutoff; total CI goal is 14 minutes.
        timeout-minutes: 14
        env:
          TEST_TIMING_DIR: reports/behavior-timing
          COVERAGE_FILE: .coverage.${{ matrix.shard_id }}
          SHARD_ID: ${{ matrix.shard_id }}
          SHARD_MANIFEST: ${{ matrix.manifest }}
          BEHAVIORAL_DISPATCH_PROFILE: ci/test_shards/durations.json
          SELECTED_ARMY_SOURCE_INDEX: ${{ runner.temp }}/selected-army-source-index
          SELECTED_INDEX_CACHE_HIT: ${{ steps.source-index-cache.outputs.cache-hit }}
          SELECTED_INDEX_INPUT_KEY: ${{ steps.source-inputs.outputs.key }}
        run: |
          mkdir -p reports
          mapfile -t shard_paths < "$SHARD_MANIFEST"
          source_index_deadline=$(( $(date +%s) + 14 * 60 ))
          uv run --no-sync python -B -m scripts.validate_source_history
          source_index_pid=""
          source_index_args=()
          finish_source_index_build() {
            if [[ -n "$source_index_pid" ]]; then
              if wait "$source_index_pid"; then
                source_index_pid=""
              else
                source_index_status=$?
                exit "$source_index_status"
              fi
            fi
          }
          if [[ "$SELECTED_INDEX_CACHE_HIT" != "true" ]]; then
            completion_dir=$(mktemp -d "$RUNNER_TEMP/source-index-completion.XXXXXX")
            uv run --no-sync python -B -m scripts.ci_source_index \
              data/source_snapshots/wahapedia/10th-edition/2026-06-14/json \
              "$SELECTED_ARMY_SOURCE_INDEX" "$completion_dir/result.json" \
              "$SELECTED_INDEX_INPUT_KEY" &
            source_index_pid=$!
            source_index_args=(-p scripts.ci_source_index
              --ci-source-index-result "$completion_dir/result.json"
              --ci-source-index-target "$SELECTED_ARMY_SOURCE_INDEX"
              --ci-source-index-key "$SELECTED_INDEX_INPUT_KEY"
              --ci-source-index-deadline "$source_index_deadline")
          fi
          isolated_status=0
          parallel_timing_dir="$TEST_TIMING_DIR"
          isolated_case="tests/factions/chaos_daemons/integration/test_cavalcade_v995_roster.py::test_exact_mirror_deploys_all_78_models_and_replays_to_battle"
          isolation_args=(--deselect "$isolated_case")
          if grep -Fxq "$isolated_case" "$SHARD_MANIFEST"; then
            # Keep the bounded success fixture separate from concurrent coverage
            # work, including when refreshed costs move it to another shard.
            if TEST_TIMING_DIR="$TEST_TIMING_DIR/isolated-mirror" \
              uv run --no-sync python -m pytest "$isolated_case" \
                  "${source_index_args[@]}" \
                -n 1 \
                --dist=worksteal \
                -o faulthandler_timeout=180 \
                -o faulthandler_exit_on_timeout=false \
                --selected-army-source-index="$SELECTED_ARMY_SOURCE_INDEX" \
                --cov=warhammer40k_core \
                --cov-report= \
                --cov-fail-under=0 \
                --durations=100 \
                --durations-min=0.1 \
                --junitxml="reports/behavior-shard-${SHARD_ID}-isolated-mirror.xml"; then
              echo "Isolated mirror test passed."
            else
              isolated_status=$?
            fi
            isolation_args=(--deselect "$isolated_case" --cov-append)
            parallel_timing_dir="$TEST_TIMING_DIR/remainder"
            finish_source_index_build
          fi
          parallel_status=0
          if TEST_TIMING_DIR="$parallel_timing_dir" \
            uv run --no-sync python -m pytest "${shard_paths[@]}" "${isolation_args[@]}" \
            "${source_index_args[@]}" \
            -n auto \
            --dist=worksteal \
            -o faulthandler_timeout=180 \
            -o faulthandler_exit_on_timeout=false \
            --selected-army-source-index="$SELECTED_ARMY_SOURCE_INDEX" \
            --cov=warhammer40k_core \
            --cov-report= \
            --cov-fail-under=0 \
            --durations=100 \
            --durations-min=0.1 \
            --junitxml="reports/behavior-shard-${SHARD_ID}.xml"; then
            echo "Parallel shard cases passed."
          else
            parallel_status=$?
          fi
          finish_source_index_build
          if (( isolated_status != 0 || parallel_status != 0 )); then
            exit 1
          fi

      - name: Save completed selected-source index
        if: ${{ always() && matrix.shard_id != '1' && steps.behavior.outputs.source_index_built == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/selected-army-source-index
          key: ${{ steps.source-inputs.outputs.key }}

      - name: Upload shard test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: behavior-report-${{ matrix.shard_id }}
          path: reports/
          if-no-files-found: warn

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: behavior-coverage-${{ matrix.shard_id }}
          path: .coverage.${{ matrix.shard_id }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    name: coverage-gate
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false
        )
      }}
    needs: behavior-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require successful behavioral shards
        if: needs.behavior-tests.result != 'success'
        run: |
          echo "One or more behavioral shards did not succeed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync coverage dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Download shard coverage
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: behavior-coverage-*
          path: coverage-data

      - name: Combine coverage and enforce branch threshold
        run: |
          uv run --no-sync python scripts/check_shard_coverage.py coverage-data --shard-count 12
          uv run --no-sync coverage combine coverage-data/behavior-coverage-*
          uv run --no-sync coverage report --fail-under=66.5
